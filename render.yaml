services:
  - type: web
    name: it-enterprise-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PINECONE_INDEX_NAME
        value: fde-it-support-rag
      - key: PINECONE_NAMESPACE
        value: company-it-kb
      - key: EMBEDDING_MODEL
        value: multilingual-e5-large
      - key: TOP_K
        value: "4"
      - key: MAX_RETRIES
        value: "1"
      - key: ADMIN_API_KEY
        sync: false
