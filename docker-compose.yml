services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_enterprise_copilot
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
